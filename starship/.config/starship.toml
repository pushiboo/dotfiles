"$schema" = 'https://starship.rs/config-schema.json'

format = """
[](color_purple)\
$os\
$username\
[](fg:color_purple bg:color_strawberry)\
$directory\
[](fg:color_strawberry bg:color_peach)\
$git_branch\
$git_status\
[](fg:color_peach bg:color_blue)\
$c\
$elixir\
$elm\
$golang\
$php\
$java\
$julia\
$nodejs\
$nim\
$rust\
$scala\
[](fg:color_blue bg:color_turquoise)\
$docker_context\
[](fg:color_turquoise bg:color_greyblue)\
$time\
[ ](fg:color_greyblue)\
$line_break$character"""


# adjust scan time
scan_timeout = 1000

palette = 'pastel_push'

[palettes.pastel_push]
color_purple = '#9A348E'
color_strawberry = '#DA627D'
color_peach = '#FCA17D'
color_peach_dark = '#752303'
color_peach_darker = '#6B2002'
color_mangenta = '#A11A58'
color_blue = '#86BBD8'
color_turquoise = '#06969A'
color_greyblue = '#33658A'
color_green = '#41be54'
color_green_light = '#23DC89'
color_black = '#000000'

# color_fg0 = '#9A348E'
# color_bg1 = '#3c3836'
# color_bg3 = '#665c54'
# color_blue = '#458588'
# color_aqua = '#689d6a'
# color_green = '#98971a'
# color_orange = '#d65d0e'
# color_purple = '#9A348E'
color_red = '#cc241d'
# color_yellow = '#d79921'

[os]
disabled = false
style = "fg:color_green_light bg:color_purple"

[os.symbols]
Ubuntu = "󰕈"
SUSE = ""
Raspbian = "󰐿"
Mint = "󰣭"
Macos = "󰀵"
Manjaro = ""
Linux = "󰌽"
Gentoo = "󰣨"
Fedora = "󰣛"
Alpine = ""
Android = ""
Arch = "󰣇"
Artix = "󰣇"
EndeavourOS = ""
CentOS = ""
Debian = "󰣚"
Redhat = "󱄛"
RedHatEnterprise = "󱄛"

[username]
show_always = true
style_user = "fg:color_blue bg:color_purple"
style_root = "fg:color_red bg:color_purple"
format = '[ $user ]($style)'

[directory]
style = "fg:color_peach_darker bg:color_strawberry"
format = "[ $path ]($style)"
truncation_length = 3
truncation_symbol = "…/"

# Here is how you can shorten some long paths by text replacement
# similar to mapped_locations in Oh My Posh:
[directory.substitutions]
"Documents" = "󰈙 "
"Downloads" = " "
"Music" = " "
"Pictures" = " "
# Keep in mind that the order matters. For example:
# "Important Documents" = " 󰈙 "
# will not be replaced, because "Documents" was already substituted before.
# So either put "Important Documents" before "Documents" or use the substituted version:
# "Important 󰈙 " = " 󰈙 "

[c]
symbol = " "
style = "bg:color_blue fg:color_black"
format = '[ $symbol ($version) ]($style)'

[cpp]
symbol = " "
style = "bg:color_blue fg:color_black"
format = '[ $symbol ($version) ]($style)'

[docker_context]
symbol = " "
style = "bg:color_turquoise fg:color_black"
format = '[ $symbol $context ]($style)'

[elixir]
symbol = " "
style = "bg:color_blue fg:color_black"
format = '[ $symbol ($version) ]($style)'

[elm]
symbol = " "
style = "bg:color_blue fg:color_black"
format = '[ $symbol ($version) ]($style)'

[git_branch]
symbol = ""
style = "bg:color_peach fg:color_peach_dark"
format = '[ $symbol $branch ]($style)'

[git_status]
style = "bg:color_peach fg:color_mangenta"
format = '[$all_status$ahead_behind ]($style)'

[golang]
symbol = " "
style = "bg:color_blue"
format = '[ $symbol ($version) ]($style)'

[gradle]
style = "bg:color_blue"
format = '[ $symbol ($version) ]($style)'

[haskell]
symbol = " "
style = "bg:color_blue"
format = '[ $symbol ($version) ]($style)'

[java]
symbol = " "
style = "bg:color_blue fg:color_black"
format = '[ $symbol ($version) ]($style)'

[julia]
symbol = " "
style = "bg:color_blue"
format = '[ $symbol ($version) ]($style)'

[nodejs]
symbol = "󰎙 "
#symbol = "  "
style = "bg:color_blue fg:color_black"
format = '[ $symbol ($version) ]($style)'

# [javascript]
# symbol = " "
# style = "bg:color_blue fg:color_black"
# format = '[ $symbol ($version) ]($style)'
#
[nim]
symbol = "󰆥 "
style = "bg:color_blue"
format = '[ $symbol ($version) ]($style)'

[rust]
symbol = ""
style = "bg:color_blue"
format = '[ $symbol ($version) ]($style)'

[scala]
symbol = " "
style = "bg:color_blue"
format = '[ $symbol ($version) ]($style)'

# [time]
# disabled = false
# time_format = "%R" # Hour:Minute Format
# style = "bg:#33658A"
# format = '[ λ $time ]($style)'

[time]
disabled = false
time_format = "%R"
style = "bg:color_greyblue"
format = '[[  $time ](fg:color_blue bg:color_greyblue)]($style)'

[line_break]
disabled = false

[character]
disabled = false
success_symbol = '[󰘧](bold fg:color_green)'
error_symbol = '[󰘧](bold fg:color_red)'
vimcmd_symbol = '[󰘧](bold fg:color_green)'
vimcmd_replace_one_symbol = '[󰘧](bold fg:color_purple)'
vimcmd_replace_symbol = '[󰘧](bold fg:color_purple)'
vimcmd_visual_symbol = '[󰘧](bold fg:color_yellow)'
