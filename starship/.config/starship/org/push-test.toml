# Get editor completions based on the config schema
"$schema" = 'https://starship.rs/config-schema.json'

# Inserts a blank line between shell prompts
add_newline = true

# Prompt format (order of modules)
format = """
$directory$git_branch$git_status
$python$nodejs$rust$golang
$character
"""

# ─── Character (success / error icon) ───────────────────────────
[character]
success_symbol = "[✔](bold green) "
error_symbol   = "[✘](bold red) "

# ─── Directory ──────────────────────────────────────────────────
[directory]
style = "bold cyan"
format = "[$path]($style)[$read_only]($read_only_style) "
truncation_length = 3
truncate_to_repo = true
read_only = " 󰌾"

# ─── Git Branch ─────────────────────────────────────────────────
[git_branch]
symbol = " "
style = "bold purple"
format = "[$symbol$branch]($style) "

# ─── Git Status ─────────────────────────────────────────────────
[git_status]
style = "bold red"
format = "([$all_status$ahead_behind]($style)) "
conflicted = "⚠ $count "
ahead = "⇡$count "
behind = "⇣$count "
diverged = "⇕⇡$ahead_count ⇣$behind_count "
untracked = "?$count "
stashed = "󰏖 $count "
modified = "~$count "
staged = "+$count "
renamed = "󰑕 $count "
deleted = "✖ $count "

# ─── Command Duration ───────────────────────────────────────────
[cmd_duration]
min_time = 2_000
format = "took [$duration](bold yellow) "

# ─── Python ─────────────────────────────────────────────────────
[python]
symbol = " "
format = "[$symbol$version]($style) "
style = "yellow"

# ─── Node.js ────────────────────────────────────────────────────
[nodejs]
symbol = " "
format = "[$symbol$version]($style) "
style = "green"

# ─── Rust ───────────────────────────────────────────────────────
[rust]
symbol = " "
format = "[$symbol$version]($style) "
style = "red"

# ─── Go ─────────────────────────────────────────────────────────
[golang]
symbol = " "
format = "[$symbol$version]($style) "
style = "cyan"

# ─── Status (shows exit code if non-zero) ───────────────────────
[status]
disabled = false
format = "[$symbol $common_meaning$signal_name$exit_code]($style) "
symbol = "✘"
style = "bold red"

# ─── Time (optional, right side) ────────────────────────────────
[time]
disabled = true
time_format = "%H:%M:%S"
style = "bright-black"
format = "[$time]($style) "

# ─── Disable unused modules ─────────────────────────────────────
[package]
disabled = true

[aws]
disabled = true

[gcloud]
disabled = true   
